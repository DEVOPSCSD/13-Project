services:
  web:
    build: .
    image: student-management-system:latest
    container_name: student-management-system
    ports:
      - "${APP_PORT:-5000}:5000"
    environment:
      SEED_DEMO_DATA: "${SEED_DEMO_DATA:-true}"
    volumes:
      - student_data:/data        # named volume: database survives restarts and re-creation
    restart: unless-stopped

volumes:
  student_data:
