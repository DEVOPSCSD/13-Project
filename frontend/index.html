<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">🎓 Student Management System</div>
    <span class="badge">Flask + SQLite + Docker + Jenkins</span>
  </header>

  <main class="container">
    <section class="stats">
      <div class="card stat">
        <span class="stat-label">Total students</span>
        <span class="stat-value" id="stat-total">0</span>
      </div>
      <div class="card stat">
        <span class="stat-label">Shown in list</span>
        <span class="stat-value" id="stat-shown">0</span>
      </div>
    </section>

    <div class="layout">
      <section class="card" id="form-section">
        <h2 id="form-title">Register student</h2>
        <form id="student-form" novalidate>
          <input type="hidden" id="record-id">
          <label for="input-student-id">Student ID</label>
          <input id="input-student-id" type="text" placeholder="e.g. CS2024010">
          <small class="field-error" id="error-student_id"></small>

          <label for="input-full-name">Full name</label>
          <input id="input-full-name" type="text" placeholder="e.g. Meera Nair">
          <small class="field-error" id="error-full_name"></small>

          <label for="input-email">Email</label>
          <input id="input-email" type="email" placeholder="name@example.com">
          <small class="field-error" id="error-email"></small>

          <label for="input-course">Course / Department</label>
          <input id="input-course" type="text" placeholder="e.g. Computer Science">
          <small class="field-error" id="error-course"></small>

          <label for="input-year">Year of study</label>
          <select id="input-year">
            <option value="">Select year</option>
            <option value="1">1</option><option value="2">2</option>
            <option value="3">3</option><option value="4">4</option>
            <option value="5">5</option><option value="6">6</option>
          </select>
          <small class="field-error" id="error-year_of_study"></small>

          <label for="input-phone">Phone (optional)</label>
          <input id="input-phone" type="tel" placeholder="e.g. 9876543210">
          <small class="field-error" id="error-phone"></small>

          <div class="actions">
            <button type="submit" id="btn-submit" class="btn primary">Add student</button>
            <button type="button" id="btn-cancel" class="btn hidden">Cancel edit</button>
          </div>
        </form>
      </section>

      <section class="card" id="directory-section">
        <div class="dir-head">
          <h2>Student directory</h2>
          <input id="search-input" type="search" placeholder="Search name, email or course…">
        </div>

        <div id="loading" class="state hidden">Loading students…</div>
        <div id="empty-state" class="state hidden">No student records found.</div>

        <div class="table-wrap">
          <table id="students-table">
            <thead>
              <tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Year</th><th>Phone</th><th>Actions</th></tr>
            </thead>
            <tbody id="students-table-body"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>

  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
      <p id="confirm-text">Delete this student?</p>
      <div class="actions">
        <button id="confirm-yes" class="btn danger">Delete</button>
        <button id="confirm-no" class="btn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
